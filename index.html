<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freude Symphony Orchestra｜出欠予定表</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div><p class="eyebrow">FREUDE SYMPHONY ORCHESTRA</p><h1 id="concertTitle">第48回定期演奏会</h1><p class="sub">オーケストラの出欠予定表</p></div><div class="account"><span id="userEmail">未ログイン</span><button id="authBtn">ログイン</button></div></header><main><div id="message" class="message"></div><section class="toolbar"><h2>みんなの出欠</h2><div><button id="refreshBtn">更新</button><button id="adminTitleBtn" class="admin-only" hidden>公演名を変更</button><button id="addEventBtn" class="primary admin-only" hidden>日程を追加</button></div></section><section id="loginPanel" class="card login-panel"><h3>出欠を共有するにはログイン</h3><p>メールアドレスを入力すると、確認リンクを送ります。</p><form id="loginForm"><input id="emailInput" type="email" required placeholder="you@example.com"><button class="primary">ログインリンクを送る</button></form></section><section id="schedule" hidden><div id="events" class="events"></div><p id="empty" class="empty">日程がまだ登録されていません。</p></section></main></div><dialog id="eventDialog"><form method="dialog" id="eventForm"><button class="close" value="cancel">×</button><h2>日程を追加</h2><label>日程名<input name="title" required maxlength="100"></label><div class="grid"><label>日付<input type="date" name="date" required></label><label>開始<input type="time" name="time" required></label><label>集合<input type="time" name="gather_time" required></label><label>終了予定<input type="time" name="end_time" required></label></div><label>会場<input name="venue" required maxlength="100"></label><label>場所のURL<input type="url" name="venue_url" placeholder="https://..."></label><label>練習メモ（曲ごとの時間など）<textarea name="memo" maxlength="2000"></textarea></label><label>種類<select name="kind"><option>合奏</option><option>分奏</option><option>本番</option></select></label><button class="primary" type="submit">保存</button></form></dialog><dialog id="titleDialog"><form method="dialog" id="titleForm"><button class="close" value="cancel">×</button><h2>公演名を変更</h2><label>公演名<input name="title" required maxlength="100"></label><button class="primary" type="submit">保存</button></form></dialog><dialog id="detailDialog"><form method="dialog"><button class="close" value="cancel">×</button><div id="detail"></div></form></dialog><dialog id="responseDialog"><form method="dialog" id="responseForm"><button class="close" value="cancel">×</button><h2 id="responseTitle"></h2><select name="status"><option value="yes">○ 出席</option><option value="partial">△ 遅刻・早退</option><option value="no">× 欠席</option><option value="maybe">? 未定</option></select><label>メモ<textarea name="note" maxlength="200"></textarea></label><button class="primary" type="submit">回答を保存</button></form></dialog><script type="module" src="app.js"></script></body></html>
